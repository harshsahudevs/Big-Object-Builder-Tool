<template>
    <lightning-button
        label={buttonLabel}
        variant={buttonVariant}
        icon-name="utility:undo"
        disabled={isButtonDisabled}
        onclick={openModal}
    ></lightning-button>

    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="restore-heading" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal} disabled={isProcessing}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="restore-heading" class="slds-modal__title slds-hyphenate">Restore archived record</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isProcessing}>
                        <lightning-spinner alternative-text="Restoring" size="small"></lightning-spinner>
                    </template>
                    <p>{confirmMessage}</p>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal} disabled={isProcessing} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button
                        label="Restore"
                        variant="brand"
                        onclick={handleConfirm}
                        disabled={isProcessing}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
